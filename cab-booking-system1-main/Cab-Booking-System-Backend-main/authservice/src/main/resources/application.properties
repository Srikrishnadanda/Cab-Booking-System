# ========================
# AUTH SERVICE
# ========================
spring.application.name=AUTH-SERVICE
server.port=8081

# Disable Config Server check (use local properties)
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/cab_booking_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sri@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Eureka ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url-path=/api/auth/swagger-ui.html

# ---- JWT ----
app.jwt-secret=4a6f686e446f6553656372657431323334353637383930313233343536373839
app.jwt-expiration-milliseconds=604800000

# ---- Swagger UI ----
springdoc.api-docs.path=/api/auth/v3/api-docs
springdoc.swagger-ui.path=/api/auth/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
